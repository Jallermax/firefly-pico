name: Sync personal deploy branches

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

concurrency:
  group: personal-deploy-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal/deploy
          fetch-depth: 0

      - name: Fetch branch inputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --prune origin '+refs/heads/personal/*:refs/remotes/origin/personal/*'
          git remote add upstream https://github.com/cioraneanu/firefly-pico.git
          git fetch --prune upstream '+refs/heads/dev:refs/remotes/upstream/dev'

      - name: Prepare stable and experimental candidates
        id: prepare
        run: bash scripts/sync-personal-branches.sh

      - name: Validate Docker dependency cache boundary
        if: steps.prepare.outputs.changed == 'true'
        run: bash tests/scripts/test_dockerfile_cache.sh

      - name: Select stable candidate
        if: steps.prepare.outputs.changed == 'true'
        run: git switch sync-stable

      - uses: actions/setup-node@v4
        if: steps.prepare.outputs.changed == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - uses: shivammathur/setup-php@v2
        if: steps.prepare.outputs.changed == 'true'
        with:
          php-version: '8.3'
          coverage: none

      - name: Restore backend dependencies
        id: backend-dependencies-cache
        if: steps.prepare.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: back/vendor
          key: ${{ runner.os }}-php-8.3-vendor-${{ hashFiles('back/composer.json', 'back/composer.lock') }}

      - name: Install locked backend dependencies
        if: steps.prepare.outputs.changed == 'true' && steps.backend-dependencies-cache.outputs.cache-hit != 'true'
        working-directory: back
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Test release channel selection
        if: steps.prepare.outputs.changed == 'true'
        working-directory: back
        run: php artisan test --filter VersionControllerTest

      - name: Test and build stable candidate
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          stable_lock=$(git hash-object front/package-lock.json)
          stable_sha=$(git rev-parse HEAD)
          upstream_version=$(git describe --tags --match '*-dev' --abbrev=0 upstream/dev)
          printf 'STABLE_LOCK=%s\n' "$stable_lock" >> "$GITHUB_ENV"
          printf 'STABLE_VERSION=%s\n' "$upstream_version" >> "$GITHUB_ENV"
          cd front
          npm ci --prefer-offline --no-audit --no-fund
          node --test tests/TodoInboxRendering.test.js tests/TodoInboxTransport.test.js tests/TodoReviewUtils.test.js tests/TodoTransactionUtils.test.js tests/VersionLinks.test.js tests/useTodoInbox.test.js
          NUXT_PUBLIC_VERSION="$upstream_version" NUXT_PUBLIC_COMMIT_SHA="$stable_sha" npm run build
          cd ..
          bash tests/scripts/verify_built_version.sh "$stable_sha" "$upstream_version"

      - name: Test and build experimental candidate
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git switch sync-experimental
          experimental_lock=$(git hash-object front/package-lock.json)
          if [ "$experimental_lock" != "$STABLE_LOCK" ]; then
            rm -rf front/node_modules
            npm ci --prefix front --prefer-offline --no-audit --no-fund
          fi
          rm -rf front/.nuxt front/.output
          experimental_sha=$(git rev-parse HEAD)
          cd front
          node --test tests/TodoInboxRendering.test.js tests/TodoInboxTransport.test.js tests/TodoReviewUtils.test.js tests/TodoTransactionUtils.test.js tests/VersionLinks.test.js tests/useTodoInbox.test.js
          node --test tests/repository/BaseRepository.test.js tests/stores/analyticsStore.test.js tests/utils/AnalyticsBalanceUtils.test.js tests/utils/AnalyticsCashUseUtils.test.js tests/utils/AnalyticsCategoryPresentationUtils.test.js tests/utils/AnalyticsForecastUtils.test.js tests/utils/AnalyticsLedgerUtils.test.js tests/utils/AnalyticsRecurringUtils.test.js tests/utils/AnalyticsUtils.test.js tests/utils/ChartUtils.test.js
          NUXT_PUBLIC_VERSION="$STABLE_VERSION" NUXT_PUBLIC_COMMIT_SHA="$experimental_sha" npm run build
          cd ..
          bash tests/scripts/verify_built_version.sh "$experimental_sha" "$STABLE_VERSION"

      - name: Publish both candidates
        if: steps.prepare.outputs.changed == 'true'
        run: git push --atomic origin refs/heads/sync-stable:refs/heads/personal/deploy refs/heads/sync-experimental:refs/heads/personal/experimental

      - name: Report no changes
        if: steps.prepare.outputs.changed != 'true'
        run: echo 'Personal deploy branches are already current.'
